<body class="font-body-md text-body-md select-none">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="fixed top-0 w-full z-50 bg-surface-container-low dark:bg-surface-container-low border-b border-outline-variant flex justify-between items-center px-margin-mobile h-touch-target-min">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed" data-icon="waves">waves</span>
<h1 class="font-display-track-mobile text-display-track-mobile text-primary-fixed uppercase tracking-tighter">GRID ENGINE</h1>

<button class="hover:bg-surface-container-high transition-colors p-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings">settings</span>
</button>
</div>
</header>

<div class="flex justify-between items-end">
<div>

<p class="font-label-mono text-label-mono text-on-surface-variant mt-1">CORE OVERLOAD (EXTENDED MIX)</p>
</div>
<div class="text-right">
<span class="font-label-sm text-label-sm text-secondary px-2 py-0.5 border border-secondary/30 rounded uppercase">Master</span>
</div>
</div>
<!-- Stats Bar -->
<div class="grid grid-cols-3 gap-2 mt-4 bg-surface-container-low border border-outline-variant rounded-xl p-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">BPM</span>
<span class="font-display-track text-display-track text-primary-fixed-dim">128.00</span>
</div>
<div class="flex flex-col items-center border-x border-outline-variant">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Key</span>
<span class="font-display-track text-display-track text-tertiary-fixed-dim">4A</span>
</div>
<div class="flex flex-col items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">Remaining</span>
<span class="font-display-track text-display-track text-on-surface">04:32.1</span>
</div>
</div>
</section>
<!-- Waveform Analysis Canvas -->
<section class="flex-grow flex flex-col relative overflow-hidden bg-black py-4">
<!-- Transient Markers (Top Labels) -->
<div class="absolute top-6 left-0 w-full px-margin-mobile flex justify-between z-10">
<span class="font-label-mono text-[10px] text-tertiary-fixed/40">INTRO [16]</span>
<span class="font-label-mono text-[10px] text-secondary-fixed-dim/40">DROP [64]</span>
<span class="font-label-mono text-[10px] text-primary-fixed/40">OUTRO [128]</span>
</div>
<!-- Dynamic Waveform Placeholder -->
<div class="relative w-full h-48 flex items-center waveform-scroll">
<!-- Center Playhead -->
<div class="absolute left-1/2 -translate-x-1/2 h-full w-[2px] bg-primary-fixed z-20 shadow-[0_0_10px_rgba(125,244,255,0.8)]"></div>
<!-- Beatgrid Overlay -->
<div class="absolute inset-0 flex items-center justify-around pointer-events-none px-gutter">
<!-- Iterating beat markers -->
<div class="h-full w-[1px] beat-line-downbeat"></div>
<div class="h-full w-[1px] beat-line"></div>
<div class="h-full w-[1px] beat-line"></div>
<div class="h-full w-[1px] beat-line"></div>
<div class="h-full w-[1px] beat-line-downbeat"></div>

<div class="w-1 h-16 bg-secondary-container rounded-full"></div>

<section class="p-margin-mobile grid grid-cols-2 gap-4">

<div class="grid grid-cols-2 gap-2">

                CUE
            </button>
<!-- Play/Pause -->
<button class="w-20 h-20 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center active:scale-90 transition-transform glow-active" id="play-btn">
<span class="material-symbols-outlined text-4xl" data-icon="play_arrow">play_arrow</span>
</button>

</button>

<!-- Bottom Navigation Bar (Shared Component Strategy) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-low border-t border-outline-variant flex justify-around items-center h-16 pb-safe px-gutter">
<!-- Dashboard (Active) -->
<a class="flex flex-col items-center justify-center text-primary-fixed-dim bg-primary-fixed/10 rounded-xl px-3 py-1 transition-transform active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>

</a>

<span class="material-symbols-outlined" data-icon="grid_on">grid_on</span>
<span class="font-label-sm text-label-sm uppercase">Editor</span>
</a>
<!-- Library -->

<span class="material-symbols-outlined" data-icon="library_music">library_music</span>
<span class="font-label-sm text-label-sm uppercase">Library</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-sm text-label-sm uppercase">Sync</span>
</a>
</nav>
<script>
        // Micro-interactions for the performance feel
        const playBtn = document.getElementById('play-btn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            const icon = playBtn.querySelector('.material-symbols-outlined');
            icon.textContent = isPlaying ? 'pause' : 'play_arrow';
            
            if(isPlaying) {
                playBtn.classList.remove('bg-primary-fixed');
                playBtn.classList.add('bg-secondary-container', 'text-on-secondary');
            } else {
                playBtn.classList.add('bg-primary-fixed');
                playBtn.classList.remove('bg-secondary-container', 'text-on-secondary');
            }
        });

        // Simple haptic-like scaling feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
