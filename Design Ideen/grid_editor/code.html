<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#7df4ff",
                        "primary-fixed-dim": "#00dbe9",
                        "secondary-container": "#ff4b89",
                        "tertiary": "#e5ffba",
                        "on-secondary": "#66002c",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary": "#00363a",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "secondary-fixed-dim": "#ffb1c3",
                        "surface-dim": "#131313",
                        "error-container": "#93000a",
                        "inverse-surface": "#e5e2e1",
                        "surface": "#131313",
                        "on-secondary-container": "#590026",
                        "surface-tint": "#00dbe9",
                        "inverse-primary": "#006970",
                        "on-secondary-fixed-variant": "#8f0041",
                        "tertiary-fixed-dim": "#94db00",
                        "surface-bright": "#393939",
                        "primary-container": "#00f0ff",
                        "on-primary-fixed-variant": "#004f54",
                        "surface-container-high": "#2a2a2a",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#121f00",
                        "error": "#ffb4ab",
                        "on-primary-container": "#006970",
                        "surface-container-highest": "#353534",
                        "outline-variant": "#3b494b",
                        "on-tertiary": "#223600",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#456900",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-container": "#a2ef00",
                        "tertiary-fixed": "#a9f900",
                        "secondary": "#ffb1c3",
                        "inverse-on-surface": "#313030",
                        "on-surface-variant": "#b9cacb",
                        "secondary-fixed": "#ffd9e0",
                        "surface-container": "#201f1f",
                        "surface-variant": "#353534",
                        "primary": "#dbfcff",
                        "on-background": "#e5e2e1",
                        "on-secondary-fixed": "#3f0019",
                        "on-primary-fixed": "#002022",
                        "on-tertiary-fixed-variant": "#334f00",
                        "outline": "#849495"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "24px",
                        "margin-mobile": "12px",
                        "unit": "4px",
                        "touch-target-min": "44px",
                        "gutter": "8px"
                    },
                    "fontFamily": {
                        "headline-deck": ["Inter"],
                        "display-track-mobile": ["Inter"],
                        "display-track": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-deck": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "display-track-mobile": ["18px", {"lineHeight": "22px", "fontWeight": "700"}],
                        "display-track": ["20px", {"lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["10px", {"lineHeight": "12px", "letterSpacing": "0.03em", "fontWeight": "700"}],
                        "label-mono": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        .waveform-gradient {
            background: linear-gradient(180deg, rgba(125, 244, 255, 0.4) 0%, rgba(125, 244, 255, 0.1) 100%);
        }
        .beat-marker-primary {
            box-shadow: 0 0 8px #7df4ff;
        }
        .beat-marker-secondary {
            box-shadow: 0 0 4px rgba(255, 75, 137, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b494b; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md text-body-md overflow-hidden select-none">
<!-- Top Navigation (Shell suppressed for Task Focus) -->
<header class="fixed top-0 w-full z-50 bg-surface-container-low border-b border-outline-variant flex justify-between items-center px-margin-mobile h-touch-target-min">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-primary-fixed-dim active:scale-95 transition-transform" onclick="window.history.back()">arrow_back</button>
<span class="font-display-track-mobile text-display-track-mobile text-primary-fixed uppercase tracking-tighter">GRID ENGINE</span>
</div>
<div class="flex items-center gap-4">
<div class="bg-surface-container px-3 py-1 border border-outline-variant rounded flex items-center gap-2">
<span class="font-label-mono text-label-sm text-on-surface-variant">BPM</span>
<span class="font-label-mono text-label-mono text-primary-fixed-dim">124.00</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-high transition-colors p-1 rounded">settings</button>
</div>
</header>
<main class="pt-touch-target-min h-screen flex flex-col">
<!-- Waveform Stage -->
<section class="flex-grow relative bg-surface-container-lowest overflow-hidden flex flex-col justify-center">
<!-- Technical Overlay Info -->
<div class="absolute top-4 left-4 z-10 flex flex-col gap-1">
<div class="flex items-center gap-2">
<span class="font-label-mono text-label-sm text-on-tertiary-container bg-tertiary-container px-1.5 py-0.5 rounded">SYNC</span>
<span class="font-label-mono text-label-sm text-on-surface-variant">BAR 32.1</span>
</div>
<h1 class="font-headline-deck text-headline-deck text-on-surface">Neon Circuitry (Original Mix)</h1>
</div>
<!-- Waveform Viewport -->
<div class="relative w-full h-64 border-y border-outline-variant/30 flex items-center">
<!-- Grid Lines -->
<div class="absolute inset-0 flex justify-around pointer-events-none opacity-20">
<div class="w-px h-full bg-white/10"></div>
<div class="w-px h-full bg-white/10"></div>
<div class="w-px h-full bg-white/10"></div>
<div class="w-px h-full bg-white/10"></div>
</div>
<!-- Central Playhead -->
<div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-primary-fixed-dim z-30 beat-marker-primary"></div>
<!-- Close-up Waveform Visualization -->
<div class="flex items-center gap-0.5 px-4 opacity-80 h-full w-full">
<!-- Iterative Waveform Elements -->
<div class="flex-grow flex items-center justify-center gap-px">
<script>
                            // Generate pseudo-waveform bars
                            const container = document.currentScript.parentElement;
                            for(let i=0; i<200; i++) {
                                const height = Math.random() * 80 + 10;
                                const bar = document.createElement('div');
                                bar.className = 'w-1 bg-primary-fixed-dim rounded-full opacity-60';
                                bar.style.height = `${height}%`;
                                if (i % 32 === 0) {
                                    const marker = document.createElement('div');
                                    marker.className = 'absolute top-0 w-0.5 h-full bg-primary-fixed beat-marker-primary z-20';
                                    marker.style.left = `${(i/200)*100}%`;
                                    container.appendChild(marker);
                                } else if (i % 8 === 0) {
                                    const submarker = document.createElement('div');
                                    submarker.className = 'absolute top-1/4 w-px h-1/2 bg-on-surface-variant opacity-40 z-10';
                                    submarker.style.left = `${(i/200)*100}%`;
                                    container.appendChild(submarker);
                                }
                                container.appendChild(bar);
                            }
                        </script>
</div>
</div>
</div>
<!-- Zoom & Scrub Controls -->
<div class="absolute bottom-4 right-4 flex items-center gap-2 bg-surface-container-high/80 backdrop-blur border border-outline-variant p-1 rounded-xl">
<button class="material-symbols-outlined p-2 hover:text-primary-fixed-dim active:scale-90 transition-all">zoom_in</button>
<div class="w-px h-6 bg-outline-variant"></div>
<button class="material-symbols-outlined p-2 hover:text-primary-fixed-dim active:scale-90 transition-all">zoom_out</button>
</div>
</section>
<!-- Tools Console -->
<footer class="bg-surface-container-low border-t border-outline-variant p-margin-mobile md:p-6">
<div class="max-w-4xl mx-auto flex flex-col gap-6">
<!-- Toggle & Main Info -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4 bg-surface-container rounded-full p-1 border border-outline-variant">
<button class="px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all bg-primary-fixed-dim text-on-primary" id="static-btn">Static</button>
<button class="px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all text-on-surface-variant hover:text-on-surface" id="dynamic-btn">Dynamic</button>
</div>
<div class="flex items-center gap-6">
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Grid Offset</p>
<p class="font-label-mono text-label-mono text-secondary-fixed">+12ms</p>
</div>
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Interval</p>
<p class="font-label-mono text-label-mono text-tertiary-fixed">483.8ms</p>
</div>
</div>
</div>
<!-- Command Grid -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<button class="group flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant hover:border-primary-fixed-dim p-4 rounded-xl transition-all active:scale-95">
<span class="material-symbols-outlined text-primary-fixed-dim group-hover:scale-110 transition-transform">align_horizontal_center</span>
<span class="font-label-sm text-label-sm uppercase text-on-surface-variant">Slip Grid</span>
</button>
<button class="group flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant hover:border-primary-fixed-dim p-4 rounded-xl transition-all active:scale-95">
<span class="material-symbols-outlined text-primary-fixed-dim group-hover:scale-110 transition-transform">speed</span>
<span class="font-label-sm text-label-sm uppercase text-on-surface-variant">Adjust BPM</span>
</button>
<button class="group flex flex-col items-center justify-center gap-2 bg-surface-container border border-outline-variant hover:border-primary-fixed-dim p-4 rounded-xl transition-all active:scale-95">
<span class="material-symbols-outlined text-primary-fixed-dim group-hover:scale-110 transition-transform">start</span>
<span class="font-label-sm text-label-sm uppercase text-on-surface-variant">Set First Beat</span>
</button>
<button class="group flex flex-col items-center justify-center gap-2 bg-primary-fixed/10 border border-primary-fixed-dim p-4 rounded-xl transition-all active:bg-primary-fixed/20 active:scale-95" id="tap-tempo">
<span class="material-symbols-outlined text-primary-fixed group-hover:animate-pulse">touch_app</span>
<span class="font-label-sm text-label-sm uppercase text-primary-fixed">Tap Tempo</span>
</button>
</div>
<!-- Footer Utilities -->
<div class="flex items-center justify-between pb-safe">
<button class="text-on-surface-variant hover:text-error transition-colors flex items-center gap-2">
<span class="material-symbols-outlined">restart_alt</span>
<span class="font-label-sm text-label-sm uppercase">Reset Analysis</span>
</button>
<div class="flex gap-2">
<button class="px-6 py-2 bg-surface-container-high text-on-surface font-label-sm text-label-sm uppercase rounded-lg hover:bg-surface-variant transition-colors border border-outline-variant">Cancel</button>
<button class="px-6 py-2 bg-primary-fixed-dim text-on-primary font-label-sm text-label-sm uppercase rounded-lg hover:brightness-110 transition-all shadow-[0_0_15px_rgba(0,219,233,0.3)]">Save Grid</button>
</div>
</div>
</div>
</footer>
</main>
<!-- UI Logic Scripts -->
<script>
        // Toggle Logic
        const staticBtn = document.getElementById('static-btn');
        const dynamicBtn = document.getElementById('dynamic-btn');

        staticBtn.addEventListener('click', () => {
            staticBtn.className = 'px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all bg-primary-fixed-dim text-on-primary';
            dynamicBtn.className = 'px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all text-on-surface-variant hover:text-on-surface';
        });

        dynamicBtn.addEventListener('click', () => {
            dynamicBtn.className = 'px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all bg-primary-fixed-dim text-on-primary';
            staticBtn.className = 'px-4 py-1.5 rounded-full font-label-sm text-label-sm uppercase transition-all text-on-surface-variant hover:text-on-surface';
        });

        // Simple Tap Tempo Animation
        const tapBtn = document.getElementById('tap-tempo');
        tapBtn.addEventListener('mousedown', () => {
            tapBtn.style.transform = 'scale(0.95)';
        });
        tapBtn.addEventListener('mouseup', () => {
            tapBtn.style.transform = 'scale(1)';
        });
    </script>
</body></html>
